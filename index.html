      line-height: 1.4;
    }

    .cp-arrow {
      flex: 0 0 auto;
      width: 16px;
      height: 16px;
      color: var(--cp-muted);
    }

    .cp-small-note {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-top: 11px;
      padding: 11px 13px;
      border-radius: 15px;
      background: var(--cp-surface-soft);
      color: var(--cp-muted);
      font-size: 10px;
      line-height: 1.45;
    }

    .cp-small-note svg {
      flex: 0 0 auto;
      width: 15px;
      height: 15px;
      color: var(--cp-mint);
    }

    .cp-screen-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin: 3px 0 14px;
    }

    .cp-screen-head .cp-title {
      font-size: 24px;
    }

    .cp-round-add {
      display: grid;
      flex: 0 0 42px;
      place-items: center;
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 14px;
      background: var(--cp-ink);
      color: var(--cp-app);
      cursor: pointer;
    }

    .cp-round-add svg {
      width: 19px;
      height: 19px;
    }

    .cp-partner-bubble {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 12px;
      padding: 10px 12px;
      border-radius: 14px;
      background: var(--cp-sun-soft);
      color: var(--cp-ink);
      font-size: 11px;
      line-height: 1.4;
    }

    .cp-partner-bubble .cp-mini-avatar {
      display: grid;
      flex: 0 0 25px;
      place-items: center;
      width: 25px;
      height: 25px;
      border-radius: 50%;
      background: var(--cp-surface);
      color: var(--cp-ink);
      font-size: 9px;
      font-weight: 500;
    }

    .cp-filters {
      display: flex;
      gap: 7px;
      margin-bottom: 12px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .cp-filters::-webkit-scrollbar {
      display: none;
    }

    .cp-filter {
      flex: 0 0 auto;
      min-height: 34px;
      padding: 0 13px;
      border: 1px solid var(--cp-line);
      border-radius: 999px;
      background: transparent;
      color: var(--cp-muted);
      font-size: 10px;
      font-weight: 500;
      cursor: pointer;
    }

    .cp-filter[aria-pressed=&quot;true&quot;] {
      border-color: transparent;
      background: var(--cp-ink);
      color: var(--cp-app);
    }

    .cp-list {
      display: grid;
      gap: 9px;
    }

    .cp-item {
      display: grid;
      grid-template-columns: 65px minmax(0, 1fr) 36px;
      gap: 11px;
      align-items: center;
      min-height: 82px;
      padding: 8px;
      border: 1px solid var(--cp-line);
      border-radius: 18px;
      background: var(--cp-surface);
    }

    .cp-thumb {
      position: relative;
      display: grid;
      place-items: center;
      width: 65px;
      height: 65px;
      overflow: hidden;
      border-radius: 14px;
      color: var(--cp-ink);
    }

    .cp-thumb::after {
      content: &quot;&quot;;
      position: absolute;
      right: -10px;
      bottom: -10px;
      width: 38px;
      height: 38px;
      border: 1px solid currentColor;
      border-radius: 50%;
      opacity: 0.18;
    }

    .cp-thumb svg {
      width: 27px;
      height: 27px;
      stroke-width: 1.65;
    }

    .cp-thumb.peach {
      background: var(--cp-peach-soft);
      color: var(--cp-peach);
    }

    .cp-thumb.mint {
      background: var(--cp-mint-soft);
      color: var(--cp-mint);
    }

    .cp-thumb.sun {
      background: var(--cp-sun-soft);
      color: light-dark(#a47913, var(--cp-sun));
    }

    .cp-thumb.lilac {
      background: var(--cp-lilac-soft);
      color: var(--cp-lilac);
    }

    .cp-item-copy {
      min-width: 0;
    }

    .cp-item-copy h4 {
      margin: 0 0 4px;
      overflow: hidden;
      font-size: 13px;
      font-weight: 500;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .cp-item-copy p {
      margin: 0 0 7px;
      overflow: hidden;
      color: var(--cp-muted);
      font-size: 9px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .cp-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .cp-tag {
      padding: 3px 6px;
      border-radius: 6px;
      background: var(--cp-surface-soft);
      color: var(--cp-muted);
      font-size: 8px;
      line-height: 1.2;
    }

    .cp-save {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 50%;
      background: var(--cp-surface-soft);
      color: var(--cp-muted);
      cursor: pointer;
    }

    .cp-save svg {
      width: 16px;
      height: 16px;
    }

    .cp-save.is-saved {
      background: var(--cp-peach-soft);
      color: var(--cp-peach);
    }

    .cp-save.is-saved svg {
      fill: currentColor;
    }

    .cp-primary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      min-height: 48px;
      margin-top: 13px;
      padding: 0 16px;
      border: 0;
      border-radius: 15px;
      background: var(--cp-ink);
      color: var(--cp-app);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
    }

    .cp-primary svg {
      width: 17px;
      height: 17px;
    }

    .cp-secondary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid var(--cp-line);
      border-radius: 13px;
      background: transparent;
      color: var(--cp-ink);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
    }

    .cp-form {
      margin-bottom: 12px;
      padding: 14px;
      border: 1px solid var(--cp-line);
      border-radius: 18px;
      background: var(--cp-surface);
    }

    .cp-form h3 {
      margin: 0 0 10px;
      font-size: 13px;
      font-weight: 500;
    }

    .cp-field {
      display: grid;
      gap: 5px;
      margin-bottom: 9px;
    }

    .cp-field label {
      color: var(--cp-muted);
      font-size: 9px;
      font-weight: 500;
    }

    .cp-field input,
    .cp-field select {
      width: 100%;
      min-height: 40px;
      padding: 0 11px;
      border: 1px solid var(--cp-line);
      border-radius: 11px;
      outline: 0;
      background: var(--cp-surface-soft);
      color: var(--cp-ink);
      font-size: 12px;
    }

    .cp-field input:focus,
    .cp-field select:focus {
      border-color: var(--cp-peach);
      box-shadow: 0 0 0 2px var(--cp-peach-soft);
    }

    .cp-form-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 11px;
    }

    .cp-form-actions .cp-primary {
      min-height: 42px;
      margin: 0;
    }

    .cp-history-summary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-bottom: 14px;
    }

    .cp-summary-box {
      padding: 13px;
      border-radius: 17px;
      background: var(--cp-surface-soft);
    }

    .cp-summary-box strong {
      display: block;
      font-size: 21px;
      font-weight: 500;
      letter-spacing: -0.04em;
    }

    .cp-summary-box span {
      color: var(--cp-muted);
      font-size: 9px;
    }

    .cp-timeline {
      position: relative;
      display: grid;
      gap: 11px;
      padding-left: 18px;
    }

    .cp-timeline::before {
      content: &quot;&quot;;
      position: absolute;
      top: 12px;
      bottom: 12px;
      left: 4px;
      width: 1px;
      background: var(--cp-line);
    }

    .cp-memory {
      position: relative;
      padding: 12px 13px;
      border-radius: 17px;
      background: var(--cp-surface);
      box-shadow: inset 0 0 0 1px var(--cp-line);
    }

    .cp-memory::before {
      content: &quot;&quot;;
      position: absolute;
      top: 17px;
      left: -17px;
      width: 7px;
      height: 7px;
      border: 2px solid var(--cp-app);
      border-radius: 50%;
      background: var(--cp-peach);
    }

    .cp-memory-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .cp-memory-top strong {
      font-size: 12px;
      font-weight: 500;
    }

    .cp-memory-top span {
      color: var(--cp-muted);
      font-size: 8px;
    }

    .cp-memory p {
      margin: 4px 0 8px;
      color: var(--cp-muted);
      font-size: 9px;
      line-height: 1.5;
    }

    .cp-rating {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 7px;
      border-radius: 7px;
      background: var(--cp-mint-soft);
      color: var(--cp-mint);
      font-size: 8px;
      font-weight: 500;
    }

    .cp-bottom-nav {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      padding: 9px 12px 12px;
      border-top: 1px solid var(--cp-line);
      background: var(--cp-app);
    }

    .cp-nav-btn {
      display: grid;
      place-items: center;
      gap: 4px;
      min-height: 49px;
      padding: 4px 2px;
      border: 0;
      border-radius: 13px;
      background: transparent;
      color: var(--cp-muted);
      font-size: 9px;
      font-weight: 500;
      cursor: pointer;
    }

    .cp-nav-btn svg {
      width: 18px;
      height: 18px;
      stroke-width: 1.75;
    }

    .cp-nav-btn[aria-current=&quot;page&quot;] {
      background: var(--cp-surface-soft);
      color: var(--cp-ink);
    }

    .cp-dialog-layer {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 102px 16px 22px;
      background: light-dark(rgba(37, 30, 24, 0.42), rgba(0, 0, 0, 0.64));
      backdrop-filter: blur(5px);
    }

    .cp-dialog {
      width: 100%;
      padding: 20px;
      border-radius: 24px;
      background: var(--cp-surface);
      box-shadow: var(--cp-shadow);
      animation: cp-dialog-in 220ms ease-out both;
    }

    @keyframes cp-dialog-in {
      from {
        opacity: 0;
        transform: translateY(10px) scale(0.985);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .cp-dialog {
        animation: none;
      }
    }

    .cp-dialog-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .cp-dialog-badge {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border-radius: 15px;
      background: var(--cp-lilac-soft);
      color: var(--cp-lilac);
    }

    .cp-dialog-badge svg {
      width: 23px;
      height: 23px;
    }

    .cp-dialog-close {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 50%;
      background: var(--cp-surface-soft);
      color: var(--cp-muted);
      cursor: pointer;
    }

    .cp-dialog-close svg {
      width: 17px;
      height: 17px;
    }

    .cp-dialog-kicker {
      margin: 17px 0 6px;
      color: var(--cp-peach);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.06em;
    }

    .cp-dialog h3 {
      margin: 0;
      font-size: 23px;
      font-weight: 500;
      letter-spacing: -0.035em;
      line-height: 1.3;
    }

    .cp-dialog p {
      margin: 8px 0 0;
      color: var(--cp-muted);
      font-size: 11px;
      line-height: 1.6;
    }

    .cp-dialog-actions {
      display: grid;
      grid-template-columns: 1fr 1.25fr;
      gap: 8px;
      margin-top: 17px;
    }

    .cp-dialog-actions .cp-primary {
      margin: 0;
    }

    .cp-invite-code {
      margin-top: 15px;
      padding: 15px;
      border-radius: 16px;
      background:
        linear-gradient(135deg, var(--cp-peach-soft), var(--cp-sun-soft));

    }

    .cp-invite-code span {
      display: block;
      color: var(--cp-muted);
      font-size: 9px;
    }

    .cp-invite-code strong {
      display: block;
      margin-top: 4px;
      font-size: 22px;
      font-weight: 500;
      letter-spacing: 0.16em;
    }

    @media (max-width: 520px) {
      .cp-stage {
        padding: 0;
        border-radius: 0;
      }

      .cp-stage::before,
      .cp-stage::after {
        display: none;
      }

      .cp-app {
        width: 100%;
        min-height: 680px;
        border-right: 0;
        border-left: 0;
        border-radius: 0;
        box-shadow: none;
      }

      }

        grid-template-columns: 1fr;
      }

        font-size: 20px;
      }
    }

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&quot;couple-life-prototype&quot;);
      if (!root) return;

      const screens = [...root.querySelectorAll(&quot;[data-screen]&quot;)];
      const navButtons = [...root.querySelectorAll(&quot;[data-nav]&quot;)];
      const goButtons = [...root.querySelectorAll(&quot;[data-go]&quot;)];
      const flash = root.querySelector(&quot;#cp-flash&quot;);
      const dialogLayer = root.querySelector(&quot;#cp-dialog-layer&quot;);
      const dialog = root.querySelector(&quot;#cp-dialog&quot;);
      const mealForm = root.querySelector(&quot;#cp-meal-form&quot;);
      const placeForm = root.querySelector(&quot;#cp-place-form&quot;);
      let currentView = &quot;home&quot;;
      let flashTimer;
      let lastFocused = null;
      const customItems = [];
      const memoryItems = [
        {
          title: &quot;木棉美术馆&quot;,
          date: &quot;10月24日&quot;,
          note: &quot;一起看了日落主题展，在出口买了两张明信片。&quot;,
          rating: &quot;很开心&quot;,
          icon: &quot;heart&quot;
        },
        {
          title: &quot;山野寿喜锅&quot;,
          date: &quot;10月18日&quot;,
          note: &quot;下雨天排队 20 分钟，但热汤很值得。&quot;,
          rating: &quot;还想吃&quot;,
          icon: &quot;utensils&quot;
        },
        {
          title: &quot;江边落日步道&quot;,
          date: &quot;10月12日&quot;,
          note: &quot;风很大，走了六千多步，拍到了橘子色的天。&quot;,
          rating: &quot;想再去&quot;,
          icon: &quot;sun&quot;
        }
      ];

      const icon = (name) =&gt; `&lt;i data-lucide=&quot;${name}&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;`;
      const todayLabel = () =&gt; {
        const now = new Date();
        return `${now.getMonth() + 1}月${now.getDate()}日`;
      };

      function refreshIcons() {
        if (window.lucide &amp;&amp; typeof window.lucide.createIcons === &quot;function&quot;) {
          window.lucide.createIcons({ attrs: { width: 18, height: 18 } });
        }
      }

      function saveState() {
        if (!window.openai || typeof window.openai.setWidgetState !== &quot;function&quot;) return;
        const latestMemory = memoryItems[0];
        window.openai.setWidgetState({
          modelContent: {
            activeView: currentView,
            latestMemory: latestMemory ? latestMemory.title : null,
            addedItems: customItems.length
          },
          privateContent: {
            activeView: currentView,
            customItems,
            memoryItems
          }
        }).catch(() =&gt; {});
      }

      function showFlash(message) {
        window.clearTimeout(flashTimer);
        flash.textContent = message;
        flash.hidden = false;
        flashTimer = window.setTimeout(() =&gt; {
          flash.hidden = true;
        }, 2200);
      }

      function showView(view, persist = true) {
        currentView = view;
        screens.forEach((screen) =&gt; {
          screen.hidden = screen.dataset.screen !== view;
        });
        navButtons.forEach((button) =&gt; {
          if (button.dataset.nav === view) {
            button.setAttribute(&quot;aria-current&quot;, &quot;page&quot;);
          } else {
            button.removeAttribute(&quot;aria-current&quot;);
          }
        });
        if (persist) saveState();
      }

      function closeDialog() {
        dialogLayer.hidden = true;
        dialog.innerHTML = &quot;&quot;;
        if (lastFocused &amp;&amp; typeof lastFocused.focus === &quot;function&quot;) lastFocused.focus();
      }

      function openDialog(content) {
        if (dialogLayer.hidden) lastFocused = document.activeElement;
        dialog.innerHTML = content;
        dialogLayer.hidden = false;
        refreshIcons();
        const focusTarget = dialog.querySelector(&quot;button&quot;);
        if (focusTarget) focusTarget.focus();
      }

      function renderMemories() {
        const list = root.querySelector(&quot;#cp-history-list&quot;);
        list.innerHTML = memoryItems.slice(0, 4).map((item) =&gt; `
          &lt;article class=&quot;cp-memory&quot;&gt;
            &lt;div class=&quot;cp-memory-top&quot;&gt;
              &lt;strong&gt;${escapeHtml(item.title)}&lt;/strong&gt;
              &lt;span&gt;${escapeHtml(item.date)}&lt;/span&gt;
            &lt;/div&gt;
            &lt;p&gt;${escapeHtml(item.note)}&lt;/p&gt;
            &lt;span class=&quot;cp-rating&quot;&gt;${icon(item.icon)} ${escapeHtml(item.rating)}&lt;/span&gt;
          &lt;/article&gt;
        `).join(&quot;&quot;);
        refreshIcons();
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll(&quot;&amp;&quot;, &quot;&amp;amp;&quot;)
          .replaceAll(&quot;&lt;&quot;, &quot;&amp;lt;&quot;)
          .replaceAll(&quot;&gt;&quot;, &quot;&amp;gt;&quot;)
          .replaceAll(&#x27;&quot;&#x27;, &quot;&amp;quot;&quot;)
          .replaceAll(&quot;&#x27;&quot;, &quot;&amp;#039;&quot;);
      }

      function getRandomButton(type) {
        return root.querySelector(`[data-random=&quot;${type}&quot;]`);
      }

      function visibleItems(type) {
        const selector = type === &quot;meal&quot; ? &quot;#cp-meal-list .cp-item&quot; : &quot;#cp-place-list .cp-item&quot;;
        return [...root.querySelectorAll(selector)].filter((item) =&gt; !item.hidden);
      }

      function openRandomResult(type, sourceButton) {
        const items = visibleItems(type);
        if (!items.length) {
          showFlash(&quot;这个筛选下还没有选项，先添加一个吧&quot;);
          return;
        }
        lastFocused = sourceButton;
        const picked = items[Math.floor(Math.random() * items.length)];
        const title = picked.dataset.title;
        const meta = picked.dataset.meta;
        const kind = type === &quot;meal&quot; ? &quot;今晚就吃这家？&quot; : &quot;这周就去这里？&quot;;
        const kicker = type === &quot;meal&quot; ? &quot;命运替你点了一道&quot; : &quot;共同的周末计划&quot;;

          &lt;/div&gt;

      function addMemory(type, title, meta) {
        memoryItems.unshift({
          title,

          note: type === &quot;meal&quot;
            ? `${meta}。这顿饭被两个人的随机选择选中了。`
            : `${meta}。先记下来，等周末一起去。`,
          rating: type === &quot;meal&quot; ? &quot;今晚吃这个&quot; : &quot;期待出发&quot;,

      function makeItem(type, name, category, detail) {

        const tone = category === &quot;japanese&quot; || category === &quot;outdoor&quot; ? &quot;mint&quot; : category === &quot;home&quot; ? &quot;sun&quot; : &quot;peach&quot;;
        const itemIcon = isMeal ? (category === &quot;japanese&quot; ? &quot;soup&quot; : category === &quot;home&quot; ? &quot;croissant&quot; : &quot;flame&quot;) : (category === &quot;outdoor&quot; ? &quot;trees&quot; : &quot;palette&quot;);
        const label = isMeal
          ? ({ hotpot: &quot;热乎乎&quot;, japanese: &quot;清淡系&quot;, home: &quot;家常味&quot; }[category] || &quot;想吃&quot;)
          : ({ indoor: &quot;室内&quot;, outdoor: &quot;户外&quot; }[category] || &quot;想去&quot;);
        return `

      root.querySelector(&quot;#cp-open-couple&quot;).addEventListener(&quot;click&quot;, (event) =&gt; {

      function restorePrivateState(state) {
        if (!state || typeof state !== &quot;object&quot;) return;

        if (Array.isArray(state.memoryItems) &amp;&amp; state.memoryItems.length) {
          const validMemories = state.memoryItems
            .filter((item) =&gt; item &amp;&amp; [&quot;title&quot;, &quot;date&quot;, &quot;note&quot;, &quot;rating&quot;, &quot;icon&quot;].every((key) =&gt; typeof item[key] === &quot;string&quot;))

            &amp;&amp; [&quot;name&quot;, &quot;category&quot;, &quot;detail&quot;].every((key) =&gt; typeof item[key] === &quot;string&quot;)
